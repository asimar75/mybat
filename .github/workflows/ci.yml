name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Again in a time zone with daylight saving, so clock-change handling in imports stays tested.
      - run: npm test
        env:
          TZ: Europe/Amsterdam
      - run: npm run build
